# Throwaway database of the privacy-documents suite (privacy.strategy-docs): the real db/Dockerfile server image and the real
# migration runner, project `scf-tg-w1` by default (SCF_PRIVACY_DOCS_PROJECT), no host port (queries go through
# `docker compose exec`). Started and removed by global-setup.ts; KEEP=1 leaves it running. Throwaway passwords.
services:
  pg:
    build: { context: ../../db, dockerfile: Dockerfile, target: server }
    image: scf-tg-w1-postgres:test
    user: "70:70"
    environment:
      POSTGRES_PASSWORD: privacy-docs-super
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    tmpfs: ["/var/lib/postgresql:size=1g,uid=70,gid=70,mode=0700"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 60
  migrate:
    build: { context: ../../db, dockerfile: Dockerfile, target: migrate }
    image: scf-tg-w1-db-migrate:test
    profiles: ["tools"]
    environment:
      PGHOST: pg
      PGPORT: "5432"
      SCF_DB_SUPERUSER: postgres
      SCF_DB_SUPERUSER_PASSWORD: privacy-docs-super
      SCF_DB_BOOTSTRAP: "1"
      SCF_MIGRATOR_PASSWORD: privacy-docs
      SCF_APP_PASSWORD: privacy-docs
      SCF_WRITER_PASSWORD: privacy-docs
      SCF_JOBS_PASSWORD: privacy-docs
      SCF_METRICS_RO_PASSWORD: privacy-docs
      SCF_UMAMI_RO_PASSWORD: privacy-docs
      SCF_UMAMI_MAINT_PASSWORD: privacy-docs
    depends_on:
      pg: { condition: service_healthy }
