# Spike S-01 — Umami 3.5.0 + PostgreSQL 18. Run via ./run.sh (project name scf-s01).
# APP_SECRET is generated by run.sh per run and passed through the environment; it is never written to disk.
x-umami-env: &umami-env
  DATABASE_URL: postgresql://umami:umami@db:5432/umami
  APP_SECRET: ${S01_APP_SECRET:?run via run.sh}
  CLIENT_IP_HEADER: x-scf-surrogate-ip
  SALT_ROTATION: day
  TZ: UTC
  DISABLE_TELEMETRY: "1"
  DISABLE_UPDATES: "1"
  PRIVATE_MODE: "1"

services:
  db:
    image: postgres:18-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment: { POSTGRES_DB: umami, POSTGRES_USER: umami, POSTGRES_PASSWORD: umami, TZ: UTC }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U umami -d umami"], interval: 2s, retries: 30 }

  # The engine under test, configured exactly as the design intends.
  umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    environment: *umami-env
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:18100:3000"]

  # Same database and secret, but pointed at a geo database that does not exist (item 1: "no geo DB").
  # Started by run.sh only after `umami` has applied the migrations.
  umami-nogeo:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    environment:
      <<: *umami-env
      GEOLITE_DB_PATH: /nonexistent/GeoLite2-City.mmdb
      SKIP_DB_MIGRATION: "1"
    depends_on: { db: { condition: service_healthy } }
    ports: ["127.0.0.1:18101:3000"]
    profiles: [nogeo]
