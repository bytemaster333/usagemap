# S-08 C-66 test: a separate stanza whose database node holds only a SAS token WITHOUT delete permission.
# Secrets from the environment: PGBACKREST_REPO1_AZURE_KEY (SAS token), PGBACKREST_REPO1_CIPHER_PASS.
[global]
repo1-type=azure
repo1-azure-account=scfbackupa
repo1-azure-container=pgbr-nd
repo1-azure-key-type=sas
repo1-storage-host=azurite-a
repo1-storage-port=10000
repo1-azure-uri-style=path
repo1-storage-ca-file=/certs/ca.crt
repo1-path=/nd
repo1-cipher-type=aes-256-cbc
repo1-bundle=y
repo1-block=y
repo1-retention-full=1
archive-async=y
spool-path=/var/spool/pgbackrest
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=off

[nd]
pg1-path=/var/lib/postgresql/18/docker
