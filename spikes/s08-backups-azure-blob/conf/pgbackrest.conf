# S-08 pgBackRest 2.60.0 — two Azure Blob repositories (Azurite stand-ins for two storage accounts).
# Secrets are NOT in this file; they come from the environment:
#   PGBACKREST_REPO1_AZURE_KEY, PGBACKREST_REPO1_CIPHER_PASS, PGBACKREST_REPO2_AZURE_KEY, PGBACKREST_REPO2_CIPHER_PASS
# (and PGBACKREST_REPOn_AZURE_KEY_TYPE=sas to switch a repo to a SAS token).
[global]
repo1-type=azure
repo1-azure-account=scfbackupa
repo1-azure-container=pgbr
repo1-azure-key-type=shared
# Azurite only: real Azure uses the default endpoint blob.core.windows.net with uri-style=host and no
# storage-host/port/ca-file overrides.
repo1-storage-host=azurite-a
repo1-storage-port=10000
repo1-azure-uri-style=path
repo1-storage-ca-file=/certs/ca.crt
repo1-path=/scf
repo1-cipher-type=aes-256-cbc
repo1-bundle=y
repo1-block=y
repo1-retention-full=2

repo2-type=azure
repo2-azure-account=scfbackupb
repo2-azure-container=pgbr
repo2-azure-key-type=shared
repo2-storage-host=azurite-b
repo2-storage-port=10000
repo2-azure-uri-style=path
repo2-storage-ca-file=/certs/ca.crt
repo2-path=/scf
repo2-cipher-type=aes-256-cbc
repo2-bundle=y
repo2-block=y
repo2-retention-full=2

archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[scf]
pg1-path=/var/lib/postgresql/18/docker
