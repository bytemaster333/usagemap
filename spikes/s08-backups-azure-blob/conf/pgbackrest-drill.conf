# S-08 restore-drill host: knows ONLY repo2 and holds a read+list SAS for it (C-56: keys stay on our infra).
# Secrets from the environment: PGBACKREST_REPO2_AZURE_KEY (SAS token), PGBACKREST_REPO2_CIPHER_PASS.
[global]
repo2-type=azure
repo2-azure-account=scfbackupb
repo2-azure-container=pgbr
repo2-azure-key-type=sas
repo2-storage-host=azurite-b
repo2-storage-port=10000
repo2-azure-uri-style=path
repo2-storage-ca-file=/certs/ca.crt
repo2-path=/scf
repo2-cipher-type=aes-256-cbc
process-max=4
log-level-console=warn
log-level-file=off

[scf]
pg1-path=/var/lib/postgresql/18/docker
