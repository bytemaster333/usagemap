[databases]
scf = host=pg port=5432 dbname=scf
; larger pool for the S-05 throughput runs
scf_bulk = host=pg port=5432 dbname=scf pool_size=16
; one server connection per (db,user): makes cross-client reuse of a server connection deterministic
scf_one = host=pg port=5432 dbname=scf pool_size=1
rlslab = host=pg port=5432 dbname=rlslab pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; deliberately tiny pool for the leakage tests (T4/T5) so clients share server connections
default_pool_size = 2
max_client_conn = 500
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
admin_users = postgres
logfile = /dev/stdout
log_connections = 0
log_disconnections = 0
