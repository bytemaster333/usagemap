# S-11 — Umami 3.5.0 on PostgreSQL 18, performance at design load.
# Project name: scf-s11. Host ports 18700 (Umami) and 18701 (PostgreSQL), loopback only.
# PG_CPUS / PG_MEM / PG_IO_DIRECT are set by run.sh (load phase vs. measurement phase).
name: scf-s11

services:
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${PG_PASSWORD:?}
      TZ: UTC
    # "Small dedicated database server": 4 vCPU / 16 GB RAM (Hetzner CCX23 class).
    # Memory limit includes the page cache, so the OS cache is capped like on a 16 GB host.
    cpus: ${PG_CPUS:-4}
    mem_limit: ${PG_MEM:-16g}
    shm_size: 1g
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=12GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - max_connections=100
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=lz4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - track_io_timing=on
      - -c
      - debug_io_direct=${PG_IO_DIRECT:-}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:18701:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 2s
      timeout: 3s
      retries: 60

  umami:
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://umami:${PG_PASSWORD:?}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?}
      TZ: UTC
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      PRIVATE_MODE: "1"
    # Umami gets its own 2 vCPU / 2 GB slice (app node share).
    cpus: 2
    mem_limit: 2g
    ports:
      - "127.0.0.1:18700:3000"

volumes:
  pgdata:
