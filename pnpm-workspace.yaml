packages:
  - apps/*
  - packages/umami-adapter
  - packages/api-types
  - packages/stellar-otel
  - packages/edge-otel
  - packages/payments-otel
  - packages/anchor-otel
  - packages/mobile-rn
  - packages/partner-otel
  - templates/scaffold-stellar
  - services/control-plane
  - services/jobs
  - tracker
  - tests
  - ops/alert-mailer

# Supply-chain hardening (ADR-0023): never install a version younger than 3 days.
minimumReleaseAge: 4320

# Packages allowed to run install scripts (default deny). esbuild ships its binary as an optional dependency,
# so its postinstall is not needed. workerd (ops/alert-mailer tests) likewise: its bin shim runs the binary of the
# optional platform package, so its postinstall is not needed either.
allowBuilds:
  esbuild: false
  workerd: false

# next ships sharp (Apache-2.0 AND LGPL-3.0 libvips binaries) as an optional dependency for image optimisation; the
# docs site is a static export with no image optimisation, so it is never installed (licence gate, §5.1).
ignoredOptionalDependencies:
  - sharp

# Old js-stellar-sdk majors are dev-only test copies for packages/stellar-otel (supported 13–17); pin their vulnerable
# transitive deps to fixed versions (15.1.0 pins axios 1.15.0; 13–15 use toml 3.0.0, which has no fixed 3.x).
overrides:
  "@stellar/stellar-sdk@15.1.0>axios": 1.20.0
  "@stellar/stellar-sdk@<16>toml": 5.0.1
  # packages/anchor-otel (dev only): the Wallet SDK 6.0.0 declares query-string 7 → decode-uri-component 0.2.2
  # (GHSA-qr28-fpjm-wq7f, GHSA-vcc3-ghjq-m6fr; fixed 0.5.1). Its lib/bundle.js inlines its own copy, so the installed
  # package is never loaded; the override only keeps the lockfile clean.
  "query-string@7>decode-uri-component": 0.5.1
