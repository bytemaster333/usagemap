buildinfo:
    command: scf-otelcol
    description: UsageMap Collector (OTLP in, sanitised request-duration metrics out)
    version: 1.0.0
receivers:
    - name: otlp
      module: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.0
      stability:
        logs: Stable
        metrics: Stable
        traces: Stable
processors:
    - name: filter
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.165.1
      stability:
        logs: Alpha
        metrics: Alpha
        traces: Alpha
    - name: memory_limiter
      module: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.165.0
      stability:
        logs: Beta
        metrics: Beta
        traces: Beta
    - name: scfsanitize
      module: github.com/bytemaster333/usagemap/collector/processor/scfsanitizeprocessor v0.0.0
      stability:
        logs: Undefined
        metrics: Beta
        traces: Beta
    - name: transform
      module: github.com/open-telemetry/opentelemetry-collector-contrib/processor/transformprocessor v0.165.1
      stability:
        logs: Beta
        metrics: Beta
        traces: Beta
exporters:
    - name: otlp_http
      module: go.opentelemetry.io/collector/exporter/otlphttpexporter v0.165.0
      stability:
        logs: Stable
        metrics: Stable
        traces: Stable
connectors:
    - name: signal_to_metrics
      module: github.com/open-telemetry/opentelemetry-collector-contrib/connector/signaltometricsconnector v0.165.1
      stability:
        logs-to-logs: Undefined
        logs-to-metrics: Alpha
        logs-to-traces: Undefined
        metrics-to-logs: Undefined
        metrics-to-metrics: Alpha
        metrics-to-traces: Undefined
        traces-to-logs: Undefined
        traces-to-metrics: Alpha
        traces-to-traces: Undefined
extensions:
    - name: file_storage
      module: github.com/open-telemetry/opentelemetry-collector-contrib/extension/storage/filestorage v0.165.1
      stability:
        extension: Beta
    - name: health_check
      module: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.165.1
      stability:
        extension: Alpha
providers:
    - scheme: env
      module: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0
    - scheme: file
      module: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0
