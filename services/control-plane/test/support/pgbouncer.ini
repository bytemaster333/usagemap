; PgBouncer in transaction mode, as in production (ADR-0013): the control plane's pool connects through it in the
; integration tests, so a session-state leak would show up there (S-03 T5).
[databases]
scf = host=db port=5432 dbname=scf

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 3
max_client_conn = 200
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
logfile = /dev/stdout
log_connections = 0
log_disconnections = 0
