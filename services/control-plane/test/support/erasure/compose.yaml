# The `umami` database for the erasure tests (compose project `scf-wsf-c-umami`, host port 56152):
# PostgreSQL 18.6, Umami's schema from the pinned migrate image (C-104) and our roles from `db/migrate.sh umami-views`
# (db/umami/scf_ro.sql: scf_umami_maint with DELETE and per-column SELECT only, data-model §16.1). Job `erasure`
# connects as scf_umami_maint, exactly as in production. Throwaway test passwords only.
services:
  db:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment: { POSTGRES_PASSWORD: wsfc-test-super, TZ: UTC }
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    volumes: ["./initdb:/docker-entrypoint-initdb.d:ro"]
    tmpfs: [/var/lib/postgresql]
    ports: ["127.0.0.1:${SCF_WSF_C_UMAMI_PORT:-56152}:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 1s, retries: 60 }

  umami-migrate:
    image: usagemap/umami-migrate:3.5.0-d3c62a8
    profiles: [tools]
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://umami_app:wsfc-test-umami@db:5432/umami
      CHECKPOINT_DISABLE: "1"
      PRISMA_HIDE_UPDATE_MESSAGE: "1"

  views:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    profiles: [tools]
    depends_on: { db: { condition: service_healthy } }
    volumes: ["../../../../../db:/db:ro"]
    entrypoint: ["sh", "/db/migrate.sh", "umami-views"]
    environment:
      PGHOST: db
      SCF_DB_SUPERUSER_PASSWORD: wsfc-test-super
      SCF_UMAMI_RO_PASSWORD: wsfc-test-umami-ro
      SCF_UMAMI_MAINT_PASSWORD: wsfc-test-umami-maint

  # PgBouncer in transaction mode in front of `umami`, as in production (C-115): the erasure job's scf_umami_maint pool
  # connects through it, so a startup parameter it refuses (08P01) or a leaking session SET shows up here (C-119).
  pgbouncer:
    image: edoburu/pgbouncer:latest@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d
    depends_on: { db: { condition: service_healthy } }
    volumes:
      - ./pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports: ["127.0.0.1:${SCF_WSF_C_UMAMI_PGB_PORT:-56153}:6432"]
