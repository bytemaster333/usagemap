; PgBouncer in transaction mode in front of the erasure tests' `umami` database (production settings, C-115).
[databases]
umami = host=db port=5432 dbname=umami

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 3
max_client_conn = 100
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
logfile = /dev/stdout
log_connections = 0
log_disconnections = 0
