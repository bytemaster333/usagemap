; PgBouncer in transaction mode, as in production (ADR-0013, C-115): every runtime role of the jobs service connects
; through it — scf_jobs to `scf`, scf_umami_ro and scf_umami_maint to `umami` — so a session-state leak or a lock that
; does not survive transaction pooling shows up in the tests (S-03 T5).
[databases]
scf = host=db port=5432 dbname=scf
umami = host=db port=5432 dbname=umami

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
logfile = /dev/stdout
log_connections = 0
log_disconnections = 0
