; PgBouncer as in production (infra/compose/pgbouncer/pgbouncer.ini): transaction pooling, no reset query,
; protocol-level prepared statements.
[databases]
scf = host=pg port=5432 dbname=scf

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 16
max_client_conn = 500
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
log_connections = 0
log_disconnections = 0
