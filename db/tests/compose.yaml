# Test stack of the database gate suite (db/tests). Compose project scf-wse; host ports 56100 (PostgreSQL, direct)
# and 56101 (PgBouncer, transaction mode), loopback only. Started and removed by the Go tests (TestMain);
# `KEEP=1 go test ./...` leaves it running. Passwords are throwaway values of this disposable test container.
name: scf-wse
services:
  # The server image of db/Dockerfile (target `server`: pinned postgres:18.6-alpine digest, patched packages, no gosu).
  # It runs as uid 70 from the start; the tmpfs data directory belongs to that user.
  pg:
    build: { context: .., dockerfile: Dockerfile, target: server }
    image: scf-wse-postgres:test
    user: "70:70"
    environment:
      POSTGRES_PASSWORD: wse-test-super
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command:
      [
        "postgres",
        "-c",
        "shared_preload_libraries=pg_stat_statements",
        "-c",
        "pg_stat_statements.track=all",
        "-c",
        "max_connections=200",
        "-c",
        "log_min_messages=warning",
        "-c",
        "fsync=off",
        "-c",
        "synchronous_commit=off",
        "-c",
        "full_page_writes=off",
      ]
    ports: ["127.0.0.1:${SCF_WSE_PG_PORT:-56100}:5432"]
    tmpfs: ["/var/lib/postgresql:size=2g,uid=70,gid=70,mode=0700"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      retries: 60
  bouncer:
    image: edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    entrypoint: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    ports: ["127.0.0.1:${SCF_WSE_PGB_PORT:-56101}:6432"]
    depends_on:
      pg: { condition: service_healthy }
  # The image under test (db/Dockerfile), run one-shot by the tests with `docker compose run --rm migrate …`.
  migrate:
    build: { context: .., dockerfile: Dockerfile, target: migrate }
    image: scf-wse-db-migrate:test
    profiles: ["tools"]
    environment:
      PGHOST: pg
      PGPORT: "5432"
      SCF_DB_SUPERUSER: postgres
      SCF_DB_SUPERUSER_PASSWORD: wse-test-super
      SCF_DB_BOOTSTRAP: "1"
      SCF_MIGRATOR_PASSWORD: wse-test
      SCF_APP_PASSWORD: wse-test
      SCF_WRITER_PASSWORD: wse-test
      SCF_JOBS_PASSWORD: wse-test
      SCF_METRICS_RO_PASSWORD: wse-test
      SCF_UMAMI_RO_PASSWORD: wse-test
      SCF_UMAMI_MAINT_PASSWORD: wse-test
    depends_on:
      pg: { condition: service_healthy }
