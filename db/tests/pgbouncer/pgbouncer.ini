; PgBouncer as in production (docs/data-model.md §4.1, S-03): transaction pooling, no reset query, protocol-level
; prepared statements. Tiny pools on purpose, so clients share server connections and leaks would show.
[databases]
scf = host=pg port=5432 dbname=scf
; exactly one server connection per (database, user): reuse across clients is deterministic
scf_one = host=pg port=5432 dbname=scf pool_size=1

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 2
max_client_conn = 500
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
logfile = /dev/stdout
log_connections = 0
log_disconnections = 0
