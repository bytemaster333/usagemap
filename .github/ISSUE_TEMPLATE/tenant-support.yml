# SPDX-License-Identifier: Apache-2.0
name: Tenant support
description: Help with integrating the tracker or an OTLP recipe, dashboards, metrics, keys or access.
title: "support: "
labels: ["tenant", "type:support"]
body:
  - type: markdown
    attributes:
      value: |
        We answer within **5 business days** and aim to resolve within **10** (docs/sla.md §9). What support covers and
        what it does not is in docs/sla.md §9.4. Real-time chat or phone support is not offered.
  - type: checkboxes
    id: privacy
    attributes:
      label: No personal or secret data
      options:
        - label: I have not included personal data, visitor IP addresses, User-Agent strings, wallet addresses of end users, API keys, ingest tokens or secret seeds (`S…`).
          required: true
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        [
          Tracker integration,
          OTLP / API metrics,
          Dashboards or metrics look wrong,
          Verdicts or trust score,
          API keys or ingest tokens,
          Access and roles,
          Erasure workflow,
          Other,
        ]
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project slug
      description: The public project slug from the portal (not a key).
  - type: textarea
    id: question
    attributes:
      label: Your question or problem
    validations:
      required: true
