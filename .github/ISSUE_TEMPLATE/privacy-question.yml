# SPDX-License-Identifier: Apache-2.0
name: Privacy-process question
description: A public question about how the platform processes data (no personal data, no individual request).
title: "privacy: "
labels: ["privacy", "type:question"]
body:
  - type: markdown
    attributes:
      value: |
        Data-subject and controller requests must not be public: send them to the privacy mailbox (see the links on
        the previous page). This form is for general questions about the documented processing (docs/privacy/).
  - type: checkboxes
    id: privacy
    attributes:
      label: No personal or secret data
      options:
        - label: My question contains no personal data and no request about an individual.
          required: true
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
