# SPDX-License-Identifier: Apache-2.0
name: Bug report
description: Something in the platform, the tracker, the portal or the APIs does not work as documented.
title: "bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. We answer within **5 business days** and aim to resolve within **10** (docs/sla.md §9).
        **Security problems:** do not use this form — report them privately (SECURITY.md).
  - type: checkboxes
    id: privacy
    attributes:
      label: No personal or secret data
      options:
        - label: I have not included personal data, visitor IP addresses, User-Agent strings, wallet addresses of end users, API keys, ingest tokens or secret seeds (`S…`).
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        [
          Tracker (browser),
          Web ingest,
          API (OTLP) ingest,
          Portal / dashboards,
          Control-plane API,
          Operator metrics API,
          Self-hosting / deployment,
          Documentation,
          Other,
        ]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Site or service IDs are fine; never keys or tokens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tracker version, release tag or commit.
