# SPDX-License-Identifier: Apache-2.0
name: Project removal request
description: Ask for a project to be removed from the platform or from public listings.
title: "removal: "
labels: ["tenant", "type:removal"]
body:
  - type: markdown
    attributes:
      value: |
        Project members can erase their own analytics data in the portal without a ticket (docs/privacy/erasure.md).
        Use this form when a whole project should leave the platform or a public listing, or when you cannot act
        yourself. Requests about a person's own data go to the privacy mailbox, not here.
  - type: checkboxes
    id: privacy
    attributes:
      label: No personal or secret data
      options:
        - label: I have not included personal data, API keys, ingest tokens or secret seeds (`S…`).
          required: true
  - type: input
    id: project
    attributes:
      label: Project slug
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: What should be removed?
      options:
        [The whole project and its data, Public listing only (snapshots, cohort views), Other]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Details
