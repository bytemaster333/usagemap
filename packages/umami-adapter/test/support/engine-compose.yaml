# SPDX-License-Identifier: Apache-2.0
# Test-only engine stack: PostgreSQL 18.6 + our hardened Umami 3.5.0 image (vendor/umami) + the real engine proxy
# (services/engine-proxy) in front of it with mutual TLS. Started by engine-stack.ts under a caller-chosen Compose
# project; only the proxy's mTLS listener and its metrics port are published (127.0.0.1). Umami publishes nothing, as in
# infra/compose. Throwaway credentials and a per-run PKI from engine-stack.ts; never used outside tests.
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

networks:
  engine: { internal: true }
  front: {}

services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_PASSWORD: ${ENG_PG_PASSWORD:?started by engine-stack.ts}
      POSTGRES_DB: umami
      POSTGRES_USER: umami_app
      TZ: UTC
    command: ["postgres", "-c", "fsync=off"]
    tmpfs: [/var/lib/postgresql]
    networks: [engine]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami_app -d umami"]
      interval: 1s
      timeout: 3s
      retries: 60

  umami-migrate:
    <<: *hardened
    image: ${ENG_UMAMI_MIGRATE_IMAGE:-usagemap/umami-migrate:3.5.0-d3c62a8}
    environment:
      DATABASE_URL: postgresql://umami_app:${ENG_PG_PASSWORD}@postgres:5432/umami
    tmpfs: ["/tmp:size=16m,mode=1777"]
    networks: [engine]
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  umami:
    <<: *hardened
    image: ${ENG_UMAMI_IMAGE:-usagemap/umami:3.5.0-d3c62a8}
    environment:
      DATABASE_URL: postgresql://umami_app:${ENG_PG_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${ENG_APP_SECRET:?started by engine-stack.ts}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
      PRIVATE_MODE: "1"
      SKIP_DB_MIGRATION: "1"
      SALT_ROTATION: day
      TZ: UTC
      CLIENT_IP_HEADER: x-scf-surrogate-ip
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /app/.next/cache:size=64m,uid=1001,gid=1001,mode=0700
    networks: [engine]
    depends_on: { umami-migrate: { condition: service_completed_successfully } }

  engine-proxy:
    <<: *hardened
    image: ${ENG_PROXY_IMAGE:-scf-wsf/engine-proxy:test}
    environment:
      EP_TLS_CERT: /pki/engine-proxy.pem
      EP_TLS_KEY: /pki/engine-proxy-key.pem
      EP_CLIENT_CA: /pki/ca.pem
      EP_UMAMI_URL: http://umami:3000
      EP_GATE_PROBE_CLOSED: 1s
      EP_LOG_LEVEL: warn
    volumes: ["${ENG_PKI_DIR:?started by engine-stack.ts}:/pki:ro"]
    networks: [engine, front]
    ports:
      - "127.0.0.1:${ENG_PROXY_PORT:?}:8443"
      - "127.0.0.1:${ENG_METRICS_PORT:?}:9464"
    depends_on: { umami: { condition: service_healthy } }
