    Problem:
      type: object
      required:
      - type
      - title
      - status
      description: RFC 9457 problem details; `code` from the closed catalogue `ProblemCode`.
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ProblemCode'
        request_id:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              pointer:
                type: string
              detail:
                type: string
    ProblemCode:
      type: string
      enum:
      - validation_failed
      - unauthenticated
      - forbidden
      - csrf_failed
      - step_up_required
      - recent_auth_required
      - not_found
      - not_acceptable
      - conflict
      - quota_exceeded
      - precondition_failed
      - unprocessable
      - rate_limited
      - internal_error
      - not_implemented
      - unavailable
      description: 'Closed catalogue of RFC 9457 `code` values, identical in `control-plane.openapi.yaml` and `operator-metrics.openapi.yaml`
        (CR-25). HTTP status per code: `validation_failed` 400 — request parameters or body invalid; `errors` lists JSON Pointers;
        `unauthenticated` 401 — no valid session, or a missing, malformed, unknown, expired or revoked key; `forbidden` 403
        — role or scope missing; `csrf_failed` 403 — state-changing request without a matching `Origin` or the `X-SCF-Request`
        header; `step_up_required` 403 — SCF-operator passkey assertion older than 10 minutes (`x-requires-step-up`, C-09);
        `recent_auth_required` 403 — tenant member''s sign-in older than 10 minutes (`x-requires-recent-auth`, C-87); `not_found`
        404 — unknown identifier, or one that belongs to another tenant (indistinguishable, C-87); `not_acceptable` 406 —
        unsupported `Accept` type; `conflict` 409 — state conflict or uniqueness violation (constraint names are never echoed);
        `quota_exceeded` 409 — tenant or site quota reached (sites, services, tokens, …); `precondition_failed` 412 — `If-Match`
        / `If-None-Match` precondition failed; `unprocessable` 422 — semantically invalid, e.g. a verification that failed;
        `rate_limited` 429 — rate limit exceeded; see `Retry-After`; `internal_error` 500 — unexpected server error (no internal
        detail echoed); `not_implemented` 501 — operation not built yet (temporary during the build; none may remain at gate G4,
        C-113); `unavailable` 503 — temporarily unavailable (read-only database fallback or engine down); see `Retry-After`.'
      x-status:
        validation_failed: 400
        unauthenticated: 401
        forbidden: 403
        csrf_failed: 403
        step_up_required: 403
        recent_auth_required: 403
        not_found: 404
        not_acceptable: 406
        conflict: 409
        quota_exceeded: 409
        precondition_failed: 412
        unprocessable: 422
        rate_limited: 429
        internal_error: 500
        not_implemented: 501
        unavailable: 503
  parameters:
    projectIds:
      name: project_ids
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
        maxItems: 500
      description: restrict to these projects (intersected with the key's tenant restriction)
    serviceIds:
      name: service_ids
      in: query
      required: false
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
        maxItems: 500
    minLevel:
      name: min_level
      in: query
