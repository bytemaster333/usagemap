        $ref: '#/components/schemas/VerificationLevel'
      description: default L1 — L0 projects are excluded unless requested (ADR-0015)
    scfAwarded:
      name: scf_awarded
      in: query
      schema:
        type: boolean
      description: only projects with (true) / without (false) a confirmed SCF-awarded registry match
    variant:
      name: variant
      in: query
      schema:
        enum:
        - verified
        - raw
        default: verified
      description: '`verified` or `raw` page views and unique visitors (C-73, both available to `web:read`, C-72); visit metrics
        are the same for both; rejected events are never included'
    dimension:
      name: dimension
      in: query
      required: true
      schema:
        enum:
        - referrer
        - country
        - device
        - browser
        - os
        - path
        - event
    apiGroup:
      name: group
      in: query
      schema:
        enum:
        - project
        - service
        - route
        default: service
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
    cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 512
    limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    format:
      name: format
      in: query
      schema:
        enum:
        - json
        - csv
      description: alternative to the Accept header; `csv` = `text/csv` (RFC 4180, header row, null values as empty cells,
        UTF-8)
    dayStart:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T00:00:00Z$
      description: first UTC day as midnight UTC, inclusive (C-86)
    dayEnd:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T00:00:00Z$
      description: midnight UTC after the last day, exclusive (C-86); range ≤ 3 660 days
    hourStart:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$
      description: first full UTC hour, inclusive (C-86)
    hourEnd:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:00:00Z$
      description: full UTC hour, exclusive (C-86); range ≤ 31 days
  responses:
    BadRequest:
      description: Invalid parameters
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://portal.example.invalid/problems/validation_failed
            title: Invalid parameters
            status: 400
            code: validation_failed
    Unauthorized:
      description: Missing, malformed (bad checksum), unknown, expired or revoked key
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://portal.example.invalid/problems/unauthenticated
            title: Missing, malformed (bad checksum), unknown, expired or revoked key
            status: 401
            code: unauthenticated
    Forbidden:
      description: Scope missing, or every requested project is outside the key's tenant restriction
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://portal.example.invalid/problems/forbidden
            title: Scope missing, or every requested project is outside the key's tenant restriction
            status: 403
            code: forbidden
    NotFound:
      description: 'Not found (not_found): unknown, outside the key''s tenant restriction, `pending` or `removed` — indistinguishable'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://portal.example.invalid/problems/not_found
            title: Not found
            status: 404
            code: not_found
    NotAcceptable:
      description: Unsupported Accept type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://portal.example.invalid/problems/not_acceptable
            title: Unsupported Accept type
            status: 406
            code: not_acceptable
    Unavailable:
      description: Temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://portal.example.invalid/problems/unavailable
            title: Temporarily unavailable
            status: 503
            code: unavailable
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
    TooManyRequests:
      description: Rate limit exceeded (per key; default 600 requests/min, C-21)
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://portal.example.invalid/problems/rate_limited
            title: Rate limited
            status: 429
            code: rate_limited
  headers:
    RateLimit-Limit:
      schema:
        type: integer
      description: requests per minute for this key
    RateLimit-Remaining:
      schema:
        type: integer
    RateLimit-Reset:
      schema:
        type: integer
      description: seconds
    Retry-After:
      schema:
        type: integer
