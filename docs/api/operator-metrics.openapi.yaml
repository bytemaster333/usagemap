components:
  securitySchemes:
    operatorKey:
      type: http
      scheme: bearer
      bearerFormat: scfa_op_<id>_<secret><crc>
      description: 'SCF-operator API key (ADR-0016, kind `op`). `Authorization: Bearer` only; keys in URLs are refused and
        treated as compromised. Scopes: web:read, api:read, registry:read.'
  schemas:
    Privacy:
      type: object
      additionalProperties: false
      properties:
        min_count:
          type: integer
          example: 10
        round_to:
          type: integer
          example: 10
        rounding:
          const: half_up_to_multiple
        aggregation:
          const: sum_of_unrounded_then_rounded
        cross_tenant_deduplication:
          const: false
      required:
      - min_count
      - round_to
      - rounding
      - aggregation
      - cross_tenant_deduplication
      description: 'ADR-0027 / C-95: applies only to web breakdown rows (omitted below `min_count`, otherwise rounded half-up
        to a multiple of `round_to`). Web totals, API metrics, verdict counters and on-chain counts are exact. Thresholds
        may still be tuned.'
    Meta:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          format: date-time
          description: inclusive (C-86)
        end:
          type: string
          format: date-time
          description: exclusive (C-86)
        generated_at:
          type: string
          format: date-time
        min_level:
          $ref: '#/components/schemas/VerificationLevel'
        variant:
          enum:
          - verified
          - raw
          - null
          description: page-view and visitor variant served (C-73); null for non-web data
        label:
          enum:
          - self-attested telemetry
          - null
        definitions:
          type: string
          format: uri
      required:
      - start
      - end
      - generated_at
      - min_level
    VerificationLevel:
      enum:
      - L0
      - L1
      - L2
      - L3
      - L4
    AccuracyClass:
      enum:
      - exp3
      - explicit15
      - explicit15_approx
      - coarse
      description: 'exp3: ≤ 4.33 % relative error (4.28 % worst measured, S-05) · explicit15: within the containing bucket''s
        width — typically +17–18 % at p50/p95 for real latency distributions; a percentile in the first bucket (APIs faster
        than 5 ms) is reported as 0.005 s and means "≤ 5 ms" (C-103) · explicit15_approx: some input interpolated · coarse:
        scale < 3 exponential input (C-23)'
    KeyInfo:
      type: object
      additionalProperties: false
      properties:
        key_id:
          type: string
        label:
          type: string
        scopes:
          type: array
          items:
            enum:
            - web:read
            - api:read
            - registry:read
        tenant_restriction:
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
        expires_at:
          type: string
          format: date-time
        rate_limit_per_min:
          type: integer
      required:
      - key_id
      - label
      - scopes
      - tenant_restriction
      - expires_at
      - rate_limit_per_min
    Project:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        status:
          enum:
          - active
          - suspended
        created_at:
          type: string
          format: date-time
        verification_level:
          $ref: '#/components/schemas/VerificationLevel'
        scf_awarded:
          type:
          - boolean
          - 'null'
        registry_project_ids:
          type: array
          items:
            type: string
            format: uuid
        site_count:
          type: integer
        service_count:
          type: integer
        metrics_endpoint:
          type: string
          format: uri
          description: /public/v1/projects/{slug}/metrics.json (readable with web:read, C-14)
      required:
      - project_id
      - slug
      - name
      - status
      - created_at
      - verification_level
      - registry_project_ids
      - site_count
      - service_count
    ProjectPage:
      type: object
