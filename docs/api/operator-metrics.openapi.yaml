# SPDX-License-Identifier: Apache-2.0
openapi: 3.1.0
info:
  title: UsageMap — SCF-operator metrics API (machine consumers)
  version: 1.0.0-draft.1
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  description: "Read-only metrics API for **downstream machine consumers** holding an SCF-operator API key (SCF\
    \ operators\ngenerate and revoke API keys that grant access to metrics). Keys (kind `op`) are created\
    \ and revoked\nby an `operator_admin` in the portal (`control-plane.openapi.yaml`, `/v1/operator/api-keys`); they expire\
    \ after at most\n365 days (C-70). Binding sources: `docs/adr/README.md` (register + Clarifications C-01 … C-112; later\
    \ clarifications\noverride earlier ones), `docs/data-model.md` §11, `docs/contracts/wire-formats.md`.\n\n**Terminology\
    \ (C-59).** \"SCF operator\" = a portal user with platform role `operator` or `operator_admin`; \"service\noperator\"\
    \ = the entity hosting the service.\n\n## Authentication and authorisation\n\n- `Authorization: Bearer scfa_op_<id>_<secret><crc>`\
    \ (ADR-0016; grammar in wire-formats §k). Checksum checked offline;\n  key looked up by id and compared as an HMAC with\
    \ the `op` pepper in constant time; checked against the database on\n  every request with a cache of at most 5 s, so revocation\
    \ is effectively immediate (C-06). Pepper versions are internal\n  and never exposed (C-81).\n- **Scopes** per operation\
    \ (`x-required-scope`, mirrored in `x-required-role` as `operator_key:<scope>`): `registry:read`\n  (projects, registry),\
    \ `web:read` (verified **and** raw web figures, C-72), `api:read`. A key's optional tenant\n  restriction is intersected\
    \ with every `project_ids` filter; a request whose projects are all outside it returns `403`.\n  A single project (`{projectId}`)\
    \ that is outside the restriction, unknown, `pending` or `removed` returns the same\n  `404` (no existence oracle).\n\
    - Every data operation is served by one allow-listed `SECURITY DEFINER` database function (`x-db-function`) that writes\n\
    \  its audit row (`x-audit-action`, a member of `AuditAction` in `control-plane.openapi.yaml`) in the same transaction\n\
    \  and applies the privacy rules below (C-17). `x-audited: true` on every data operation. At the default rate limit a\
    \ key\n  can cause up to 600 audit rows per minute in the platform chain (CR-37).\n- Rate limit per key (default 600 requests/min,\
    \ C-21): `RateLimit-*` headers; `429` with `Retry-After`.\n- Failed authentications (C-142): each client subnet gets 60 failed authentications a minute; beyond that it gets `429` before any key lookup, while valid keys keep their own per-key budget. A key with a bad checksum writes at most one aggregated audit row per minute per process, carrying only a count and never the attacker-chosen key id.\n\n## Privacy rules (ADR-0027)\n\n- SCF receives **only per-project\
    \ aggregates**, never event-level data.\n- **Minimum count and rounding apply only to web breakdown rows** (`/web/breakdowns`:\
    \ referrer, country, device,\n  browser, OS, path, event name; ADR-0027, C-95): rows below `privacy.min_count` (default\
    \ 10) are omitted, the others\n  rounded half-up to a multiple of `privacy.round_to` (default 10); sums of breakdown rows\
    \ across days or projects are\n  computed inside the `op_*` function from unrounded values and rounded once (C-89; `aggregation:\n\
    \  sum_of_unrounded_then_rounded`). Both parameters are echoed in every response; the breakdown thresholds may\n\
    \  still be tuned.\n- **Everything else is exact** (C-91, C-95): web totals (`/web/daily`, `/web/aggregate`,\
    \ `/web/summary`), API metrics\n  (request counts, status codes, latency), verdict and reason counters, and on-chain counts.\
    \ Ratios and percentiles are\n  `null` only when their denominator is zero. Trust scores are advisory, not counts; `score`\
    \ is `null`\n  (`insufficient_data`) when the published algorithm has too few events.\n- Visitor figures are **sums of\
    \ per-site daily unique visitors** (`visitors_sum`); no cross-site or cross-project\n  de-duplication (\"reach\") is ever\
    \ computed.\n- Comparing separately rounded breakdown rows can narrow an omitted value. This differencing risk is a recorded\n\
    \  residual risk (TM-ISO-07, CR-36).\n- Projects at verification level L0 are excluded unless `min_level=L0`; `pending`\
    \ and `removed` projects are never\n  returned. The programme `metrics_endpoint` answers `404` for `pending`, `suspended`\
    \ and `removed` projects (C-94).\n- API metrics are **self-attested telemetry** (`meta.label`); percentiles carry `accuracy_class`.\
    \ Trust scores are\n  advisory.\n\n## Web metric definitions (C-73)\n\n`variant=verified|raw` selects page views (`pageviews`,\
    \ `pageviews_unidentified`) and unique visitors (`visitors_sum`):\nverified page views are events tagged `v` in the main\
    \ and the twin website (events without a visitor identifier), raw\npage views all events of both; `pageviews_unidentified`\
    \ is the twin website's share, verified and raw by the same rule;\nverified visitors are sessions with at least one verified\
    \ event, raw visitors all sessions. `visits`, `bounces`,\n`bounce_rate_pct`, `avg_visit_duration_s` and `suspect_pageview_share`\
    \ are **one figure each**, computed over all\nidentified, non-rejected events, and identical for both variants — there\
    \ is no verified-only variant of them. A visit\nwith any custom or wallet event is not a bounce (C-75).\n\n## Conventions\n\
    \n- **Ranges (C-86).** `start` (inclusive) and `end` (exclusive), RFC 3339 in UTC. Daily operations require both to be\n\
    \  midnight UTC; `/op/v1/api/hourly` requires full hours. No inclusive end dates. Daily rows may change until `is_final`\n\
    \  (late delivery ≤ 72 h, C-18). Event-level detail is never available here.\n- Pagination: `limit` (1–1000, default 100),\
    \ opaque `cursor`, `next_cursor` (`null` on the last page).\n- **CSV**: send `Accept: text/csv` or `format=csv`: RFC 4180,\
    \ UTF-8, header row with the JSON field names of the row\n  object (nested objects flattened with `.`), null values as\
    \ empty cells; pagination via the\n  `Link: <…>; rel=\"next\"` header. The privacy echo is sent as headers `X-SCF-Min-Count`\
    \ and `X-SCF-Round-To`.\n- Errors: RFC 9457 `application/problem+json`; `code` is a member of the closed catalogue `ProblemCode`,\
    \ identical to the\n  one in `control-plane.openapi.yaml`.\n- **Naming differences from `control-plane.openapi.yaml` (deliberate,\
    \ CR-34).** This machine API uses `project_id`\n  (= the portal's `tenant_id`), status classes `status_2xx`…`status_5xx`/`status_unknown`\
    \ (portal: `s2xx`…/`unknown`),\n  page size ≤ 1000 (portal ≤ 200); `min_level` defaults to L1 in both. operationIds carry\
    \ the prefix `metrics` so the\n  two documents can be generated into one type package (CR-24).\n\n## Design choices made\
    \ in this document\n\n1. Separate base path `/op/v1` on the control-plane host, bearer key only, no cookies.\n2. Response\
    \ envelope `{data, next_cursor, privacy, meta}`; privacy parameters echoed in every response.\n3. Web: `daily` (per project\
    \ or site), `aggregate` (ecosystem per day), `summary` (per project over the range),\n   `breakdowns`, `verdicts`. API:\
    \ `daily`, `hourly` (≤ 31 days), `summary`, each grouped by project, service or route.\n4. Breakdown rows below the minimum\
    \ count are omitted rather than returned as null.\n5. `min_level` default L1; `scf_awarded` filter for registry linkage.\n\
    6. `/op/v1/me` for key introspection; `metrics_endpoint` documents are reachable with `web:read` at the public path.\n\
    7. `/op/v1/cohorts` (C-136): SCF cohorts by round, category or award stage, suppressed below 5 projects.\n\
    \n## Open points\n\n1. The default and maximum page size (1 000) and the 3 660-day range limit are starting values and may be tuned.\n"
servers:
- url: https://portal.example.invalid
  description: control-plane host on <domain-a> (placeholder)
security:
- operatorKey: []
tags:
- name: meta
- name: projects
- name: web
- name: api
- name: trust
paths:
  /op/v1/me:
    get:
      operationId: metricsGetKeyInfo
      summary: 'The calling key: scopes, tenant restriction, expiry, rate limit'
      tags:
      - meta
      security:
      - operatorKey: []
      x-required-scope: null
      x-required-role:
      - operator_key
      x-audited: false
      parameters: []
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeyInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 'Any valid key. Not a data read: no audit row; the key''s `last_used_at` is updated. Scope-less (`x-required-scope:
        null`).'
  /op/v1/projects:
    get:
      operationId: metricsListProjects
      summary: Projects with verification level and registry linkage
      tags:
      - projects
      security:
      - operatorKey:
        - registry:read
      x-required-scope: registry:read
      x-required-role:
      - operator_key:registry:read
      x-audited: true
      x-audit-action: operator.read.op_projects
      x-db-function: scf.op_projects
      parameters:
      - $ref: '#/components/parameters/projectIds'
      - $ref: '#/components/parameters/minLevel'
      - $ref: '#/components/parameters/scfAwarded'
      - $ref: '#/components/parameters/q'
      - name: sort
        in: query
        schema:
          enum:
          - slug
          - name
          - -created_at
          - created_at
          - -verification_level
          default: slug
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectPage'
            text/csv:
              schema:
                type: string
              example: 'project_id,slug,name,status,created_at,verification_level,scf_awarded,site_count,service_count

                0193b7e2-4c1a-7d3e-9a10-2b4f6c8d0e12,example,Example,active,2026-09-01T10:00:00Z,L3,true,2,1

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Active and suspended tenants only; L0 excluded unless `min_level=L0`.
  /op/v1/projects/{projectId}:
    get:
      operationId: metricsGetProject
      summary: One project
      tags:
      - projects
      security:
      - operatorKey:
        - registry:read
      x-required-scope: registry:read
      x-required-role:
      - operator_key:registry:read
      x-audited: true
      x-audit-action: operator.read.op_projects
      x-db-function: scf.op_projects
      parameters:
      - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /op/v1/registry/projects:
    get:
      operationId: metricsListRegistryProjects
      summary: Synced registry entries (Stellarlight, PG Atlas, …) with provenance
      tags:
      - projects
      security:
      - operatorKey:
        - registry:read
      x-required-scope: registry:read
      x-required-role:
      - operator_key:registry:read
      x-audited: true
      x-audit-action:
      - operator.read.registry
      - operator.read.op_projects
      x-db-function: none (global table scf.registry_projects)
      parameters:
      - $ref: '#/components/parameters/q'
      - name: scf_awarded
        in: query
        schema:
          type: boolean
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistryProjectPage'
            text/csv:
              schema:
                type: string
              example: 'registry_project_id,source,source_id,name,scf_awarded,source_as_of,fetched_at

                0193b7e2-4c1a-7d3e-9a10-2b4f6c8d0e13,stellarlight,example,Example,true,2026-11-01,2026-11-02T03:00:00Z

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Public third-party registry data; audited by the control plane (no `op_*` function needed).
  /op/v1/web/daily:
    get:
      operationId: metricsGetWebDaily
      summary: Daily web metrics per project or per site
      tags:
      - web
      security:
      - operatorKey:
        - web:read
      x-required-scope: web:read
      x-required-role:
      - operator_key:web:read
      x-audited: true
      x-audit-action:
      - operator.read.op_web_metrics
      - operator.read.op_projects
      x-db-function: scf.op_web_metrics (p_group = 'tenant' | 'site', p_bucket = 'day')
      parameters:
      - $ref: '#/components/parameters/dayStart'
      - $ref: '#/components/parameters/dayEnd'
      - $ref: '#/components/parameters/projectIds'
      - $ref: '#/components/parameters/minLevel'
      - $ref: '#/components/parameters/scfAwarded'
      - $ref: '#/components/parameters/variant'
      - name: group
        in: query
        schema:
          enum:
          - project
          - site
          default: project
      - name: sort
        in: query
        schema:
          $ref: '#/components/schemas/WebSort'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebDailyPage'
            text/csv:
              schema:
                type: string
              example: 'day,project_id,slug,site_id,verification_level,is_final,pageviews,pageviews_unidentified,visitors_sum,visits,bounces,bounce_rate_pct,avg_visit_duration_s,suspect_pageview_share

                2026-11-01,0193b7e2-4c1a-7d3e-9a10-2b4f6c8d0e12,example,,L3,true,1234,41,612,703,291,41.4,93.0,0.06

                2026-11-01,0193b7e2-4c1a-7d3e-9a10-2b4f6c8d0e14,other,,L1,true,7,0,3,4,2,50.0,31.0,0.0

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: One row per (project or site, UTC day); exact totals (C-91). `visitors_sum` is the number of distinct daily
        visitor identifiers; summing over days or sites gives a sum of daily uniques, never a de-duplicated reach.
  /op/v1/web/aggregate:
    get:
      operationId: metricsGetWebAggregate
      summary: Daily ecosystem web totals (all selected projects)
      tags:
      - web
      security:
      - operatorKey:
        - web:read
      x-required-scope: web:read
      x-required-role:
      - operator_key:web:read
      x-audited: true
      x-audit-action:
      - operator.read.op_web_metrics
      - operator.read.op_projects
      x-db-function: scf.op_web_metrics (p_group = 'all', p_bucket = 'day')
      parameters:
      - $ref: '#/components/parameters/dayStart'
      - $ref: '#/components/parameters/dayEnd'
      - $ref: '#/components/parameters/projectIds'
      - $ref: '#/components/parameters/minLevel'
      - $ref: '#/components/parameters/scfAwarded'
      - $ref: '#/components/parameters/variant'
      - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebAggregate'
            text/csv:
              schema:
                type: string
              example: 'day,projects,pageviews,pageviews_unidentified,visitors_sum,visits,bounces,bounce_rate_pct,avg_visit_duration_s,suspect_pageview_share

                2026-11-01,42,91873,2312,40218,48706,20013,41.1,88.2,0.07

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: 'Ecosystem total per day: exact sum over the selected projects inside `op_web_metrics` (C-91). No per-project
        rows.'
  /op/v1/web/summary:
    get:
      operationId: metricsGetWebSummary
      summary: Per-project web totals over the range (filter, sort)
      tags:
      - web
      security:
      - operatorKey:
        - web:read
      x-required-scope: web:read
      x-required-role:
      - operator_key:web:read
      x-audited: true
      x-audit-action:
      - operator.read.op_web_metrics
      - operator.read.op_projects
      x-db-function: scf.op_web_metrics (p_group = 'tenant', p_bucket = 'range')
      parameters:
      - $ref: '#/components/parameters/dayStart'
      - $ref: '#/components/parameters/dayEnd'
      - $ref: '#/components/parameters/projectIds'
      - $ref: '#/components/parameters/minLevel'
      - $ref: '#/components/parameters/scfAwarded'
      - $ref: '#/components/parameters/variant'
      - name: sort
        in: query
        schema:
          $ref: '#/components/schemas/WebSort'
      - name: min_pageviews
        in: query
        schema:
          type: integer
          minimum: 0
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebSummaryPage'
            text/csv:
              schema:
                type: string
              example: 'project_id,slug,verification_level,scf_awarded,all_final,pageviews,pageviews_unidentified,visitors_sum,visits,bounces,bounce_rate_pct,avg_visit_duration_s,suspect_pageview_share

                0193b7e2-4c1a-7d3e-9a10-2b4f6c8d0e12,example,L3,true,true,36912,1204,18297,21003,8695,41.4,93.0,0.06

                '
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
      description: Per project over the range; exact totals (C-91).
  /op/v1/web/breakdowns:
    get:
      operationId: metricsGetWebBreakdowns
      summary: Breakdowns by referrer, country, device, browser, OS, path or event
      tags:
      - web
      security:
      - operatorKey:
        - web:read
      x-required-scope: web:read
      x-required-role:
      - operator_key:web:read
      x-audited: true
      x-audit-action:
      - operator.read.op_web_breakdown
      - operator.read.op_projects
      x-db-function: scf.op_web_breakdown
      parameters:
      - $ref: '#/components/parameters/dayStart'
      - $ref: '#/components/parameters/dayEnd'
      - $ref: '#/components/parameters/projectIds'
      - $ref: '#/components/parameters/minLevel'
      - $ref: '#/components/parameters/scfAwarded'
      - $ref: '#/components/parameters/variant'
      - $ref: '#/components/parameters/dimension'
      - name: limit_per_project
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/format'
      responses:
        '200':
          description: OK
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimit-Limit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimit-Remaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimit-Reset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BreakdownPage'
            text/csv:
              schema:
                type: string
              example: 'project_id,slug,dimension,value,visitors_sum,pageviews,events

