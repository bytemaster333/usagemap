# Dashboards D1–D14 are provisioned read-only from ops/dashboards (generated by `scf-ops dashboards`, ADR-0022).
apiVersion: 1
providers:
  - name: scf
    folder: SCF
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options: { path: /var/lib/grafana/dashboards, foldersFromFilesStructure: false }
