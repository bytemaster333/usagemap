# Secrets of the stack (C-79): every value comes from SOPS (`scf_stack_secrets`, group_vars/app.sops.yaml, created once
# on the workstation by scripts/gen-stack-secrets.sh); derived values (connection URLs, PgBouncer's auth file, the
# public half of the edge-snapshot key) are computed here. Files are Compose file secrets (bind mounts): the directory is
# 0700 root, so no host user reads them; a file read by one container uid is 0400 and owned by it (the signing keys and
# provisioner credentials are read by the jobs service only, F16 — same uid 1000 as the control plane), a file read
# by several container users is 0444. Nothing is logged.
- name: The daily seal stays on testnet unless mainnet was approved (C-135)
  ansible.builtin.assert:
    that:
      - not scf_seal_enabled or scf_seal_network in ['testnet', 'mainnet']
      - not scf_seal_enabled or scf_seal_network == 'testnet' or scf_seal_mainnet_approved | bool
      - not scf_seal_enabled or ((scf_stack_secrets | default({})).seal_secret_seed | default('')) is match('^S[A-Z2-7]{55}$')
    fail_msg: "scf_seal_*: testnet only unless scf_seal_mainnet_approved, and scf_stack_secrets.seal_secret_seed must be an S… seed"
    quiet: true
  no_log: true

- name: Every secret is present (no generated defaults on the host — a lost VM must never take a key with it)
  ansible.builtin.assert:
    that:
      - scf_stack_secrets is defined
      - scf_stack_required_secrets | difference(scf_stack_secrets.keys() | list) | length == 0
      - scf_url_safe | map('extract', scf_stack_secrets) | select('match', '^[0-9a-f]{32,}$') | list | length == scf_url_safe | length
      - scf_pgbackrest_cipher_pass is defined and scf_dump_age_recipient is defined
      - scf_backup_repos | selectattr('key_type', 'defined') | selectattr('key_type', 'equalto', 'sas') | map(attribute='n') | map('string')
        | reject('in', ((scf_stack_secrets | default({})).backup_repo_sas | default({})).keys() | list) | list | length == 0
    fail_msg: >-
      Missing or malformed values in scf_stack_secrets (run infra/ansible/scripts/gen-stack-secrets.sh):
      {{ scf_stack_required_secrets | difference((scf_stack_secrets | default({})).keys() | list) }}
    quiet: true
  vars:
    scf_url_safe:
      [scf_app_password, scf_jobs_password, scf_metrics_ro_password, scf_umami_maint_password]
  no_log: true

- name: Public half of the edge-snapshot signing key (for the gateway, kid edge-1)
  ansible.builtin.command:
    argv: [openssl, pkey, -pubout]
    stdin: "{{ scf_stack_secrets.edge_signing_key }}"
  register: scf_edge_pub
  changed_when: false
  no_log: true

- name: Rotation slot of the edge-snapshot key (kid edge-2) — the next public key, else the current one
  ansible.builtin.set_fact:
    scf_edge_pub_slot2: "{{ scf_edge_pub_next or scf_edge_pub.stdout }}"
  no_log: true

- name: Public half of the traction-snapshot signing key (the control plane publishes it; only jobs signs, F16)
  ansible.builtin.command:
    argv: [openssl, pkey, -pubout]
    stdin: "{{ scf_stack_secrets.snapshot_signing_key }}"
  register: scf_snapshot_pub
  changed_when: false
  no_log: true

- name: Secret files
  ansible.builtin.copy:
    dest: "{{ scf_stack_secrets_dir }}/{{ item.name }}"
    content: "{{ item.content }}"
    owner: "{{ item.owner | default(0) }}"
    group: "{{ item.owner | default(0) }}"
    mode: "{{ '0400' if item.owner is defined else '0444' }}"
  loop: "{{ scf_stack_secret_files }}"
  loop_control:
    label: "{{ item.name }}"
  register: scf_stack_secrets_written
  no_log: true
  vars:
    s: "{{ scf_stack_secrets }}"
    pgb: "pgbouncer:6432"
    scf_stack_secret_files:
      # read by several containers (0444)
      - { name: pg_superuser_password, content: "{{ s.pg_superuser_password }}" }
      - { name: umami_db_password, content: "{{ s.umami_db_password }}" }
      - { name: umami_provisioner_password, content: "{{ s.umami_provisioner_password }}" }
      - { name: scf_migrator_password, content: "{{ s.scf_migrator_password }}" }
      - { name: scf_app_password, content: "{{ s.scf_app_password }}" }
      - { name: scf_writer_password, content: "{{ s.scf_writer_password }}" }
      - { name: scf_jobs_password, content: "{{ s.scf_jobs_password }}" }
      - { name: scf_metrics_ro_password, content: "{{ s.scf_metrics_ro_password }}" }
      - { name: scf_dump_login_password, content: "{{ s.scf_dump_login_password }}" }
      - { name: scf_monitor_password, content: "{{ s.scf_monitor_password }}" } # db-migrate + postgres-exporter
      - { name: scf_umami_ro_password, content: "{{ s.scf_umami_ro_password }}" }
      - { name: scf_umami_maint_password, content: "{{ s.scf_umami_maint_password }}" }
      - { name: pepper_ing, content: "{{ s.pepper_ing }}" } # control plane + gateway
      - { name: github_client_secret, content: "{{ s.github_client_secret | default('') }}" } # control plane (GitHub sign-in)
      - { name: edge_snapshot_pub.pem, content: "{{ scf_edge_pub.stdout }}\n" }
      # rotation slot (kid edge-2): the next key's public half during a rotation, else the current key again
      - { name: edge_snapshot_pub_next.pem, content: "{{ scf_edge_pub_slot2 }}\n" }
      - { name: snapshot_pub.pem, content: "{{ scf_snapshot_pub.stdout }}\n" } # published by the control plane
      - { name: heartbeat_token, content: "{{ s.heartbeat_token }}" } # alertmanager + status page
      - { name: journey_seed, content: "{{ s.journey_seed }}" } # synthetic journey member (never a real user, C-93)
      - { name: probe_otlp_token, content: "{{ s.probe_otlp_token | default('') }}" } # probe's OTLP canary (scf_probe_otlp)
      - { name: dns_token, content: "{{ s.heartbeat_token | hash('sha256') }}" } # unused in lean (health controller off); the overlay declares it
      - { name: dump_age_recipient, content: "{{ scf_dump_age_recipient }}" } # public key
      # one consumer each (0400, owned by its uid)
      - { name: umami_app_secret, content: "{{ s.umami_app_secret }}", owner: 1001 }
      - name: umami_seed_admin_password
        content: "{{ s.umami_seed_admin_password }}"
        owner: 65532
      - { name: pgbouncer_userlist, content: "{{ scf_pgbouncer_userlist }}", owner: 70 }
      - name: control_plane_database_url
        content: "postgresql://scf_app:{{ s.scf_app_password }}@{{ pgb }}/scf"
        owner: 1000
      - name: jobs_database_url
        content: "postgresql://scf_jobs:{{ s.scf_jobs_password }}@{{ pgb }}/scf"
        owner: 1000
      - name: metrics_ro_database_url
        content: "postgresql://scf_metrics_ro:{{ s.scf_metrics_ro_password }}@{{ pgb }}/scf"
        owner: 1000
      - name: jobs_listen_database_url
        content: "postgresql://scf_jobs:{{ s.scf_jobs_password }}@postgres:5432/scf"
        owner: 1000
      - { name: umami_creds_keys, content: "{{ s.umami_creds_keys }}", owner: 1000 }
      - { name: pepper_op, content: "{{ s.pepper_op }}", owner: 1000 }
      - { name: pepper_pub, content: "{{ s.pepper_pub }}", owner: 1000 }
      - { name: edge_signing_key.pem, content: "{{ s.edge_signing_key }}", owner: 1000 }
      - { name: snapshot_signing_key.pem, content: "{{ s.snapshot_signing_key }}", owner: 1000 }
      - { name: sep10_signing_seed, content: "{{ s.sep10_signing_seed }}", owner: 1000 }
      # daily seal (C-135, scf_seal_enabled): the sealing account, jobs only
      - { name: seal_secret, content: "{{ s.seal_secret_seed | default('') }}", owner: 1000 }
      - { name: grafana_admin_password, content: "{{ s.grafana_admin_password }}", owner: 472 }
      - name: pgbackrest_repo1_cipher_pass
        content: "{{ scf_pgbackrest_cipher_pass['1'] }}"
        owner: 999
      - name: pgbackrest_repo2_cipher_pass
        content: "{{ scf_pgbackrest_cipher_pass['2'] }}"
        owner: 999
      # container SAS of repositories with key_type sas (empty file otherwise; scf-backup reads it when present)
      - name: pgbackrest_repo1_key
        content: "{{ ((s.backup_repo_sas | default({}))['1'] | default('')) | regex_replace('^[?]', '') }}"
        owner: 999
      - name: pgbackrest_repo2_key
        content: "{{ ((s.backup_repo_sas | default({}))['2'] | default('')) | regex_replace('^[?]', '') }}"
        owner: 999
    scf_pgbouncer_userlist: |-
      {% for r in ['scf_app', 'scf_jobs', 'scf_writer', 'scf_metrics_ro', 'scf_umami_ro', 'scf_umami_maint'] %}
      "{{ r }}" "{{ s[r ~ '_password'] }}"
      {% endfor %}
