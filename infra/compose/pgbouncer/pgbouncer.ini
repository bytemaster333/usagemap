; PgBouncer between the runtime roles and PostgreSQL in the local stack, in transaction mode as in production
; (ADR-0013; C-103: tenant context is transaction-local, so transaction pooling is safe). Only the roles in the
; auth file (scripts/dev-secrets.sh: scf_app, scf_jobs, scf_writer, scf_metrics_ro, scf_umami_ro, scf_umami_maint)
; can log in. Migrators, the superuser steps and Umami connect to PostgreSQL directly; LISTEN needs a session and never
; comes through here (the control plane's LISTEN connections go to postgres:5432 on network `db`).
[databases]
scf = host=postgres port=5432 dbname=scf
umami = host=postgres port=5432 dbname=umami

; The jobs service holds one transaction per running job for its single-instance lock (services/jobs/src/lock.ts) next
; to its query pool (max 3); at start every enabled job runs at once. With onchain_correlation enabled that is
; 10 lock transactions + the pool, more than default_pool_size: the pool's queries starved for 10 s and failed
; tenant_purge/web_rollup at start. 20 gives scf_jobs headroom for the jobs to come (daily_seal); the other roles keep 10.
[users]
scf_jobs = pool_size=20

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /run/secrets/pgbouncer_userlist
pool_mode = transaction
default_pool_size = 10
max_client_conn = 200
max_prepared_statements = 200
server_reset_query =
ignore_startup_parameters = extra_float_digits,options
; no client addresses in the logs (privacy invariant)
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60
