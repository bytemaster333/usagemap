# SPDX-License-Identifier: Apache-2.0
# pgBackRest 2.60.0 on a database node of the HA profile (C-108, C-110): two Azure Blob repositories in two storage
# accounts (Azurite stand-ins `azurite-a`/`azurite-b`; production: two accounts in two EU regions, see
# infra/opentofu). Values as measured in S-08. No secret is in this file — they come from the environment set by the
# entrypoint: PGBACKREST_REPO{1,2}_AZURE_KEY (SAS token with `racwdl`, never x/y, C-108) and
# PGBACKREST_REPO{1,2}_CIPHER_PASS (one per repository, SOPS in production).
[global]
repo1-type=azure
repo1-azure-account=scfbackupa
repo1-azure-container=pgbackrest
repo1-azure-key-type=sas
repo1-path=/scf
repo1-cipher-type=aes-256-cbc
repo1-bundle=y
repo1-block=y
# 35-day point-in-time window (C-29): keep every full needed to restore to any point in the last 35 days.
repo1-retention-full-type=time
repo1-retention-full=35
# Azurite only (production: default endpoint blob.core.windows.net, uri-style host, system CA store).
repo1-storage-host=azurite-a
repo1-storage-port=10000
repo1-azure-uri-style=path
repo1-storage-ca-file=/run/secrets/azurite_ca

repo2-type=azure
repo2-azure-account=scfbackupb
repo2-azure-container=pgbackrest
repo2-azure-key-type=sas
repo2-path=/scf
repo2-cipher-type=aes-256-cbc
repo2-bundle=y
repo2-block=y
repo2-retention-full-type=time
repo2-retention-full=35
repo2-storage-host=azurite-b
repo2-storage-port=10000
repo2-azure-uri-style=path
repo2-storage-ca-file=/run/secrets/azurite_ca

archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
compress-type=zst
start-fast=y
log-level-console=info
log-level-file=off

[scf]
pg1-path=/var/lib/postgresql/18/main
pg1-socket-path=/var/run/postgresql
