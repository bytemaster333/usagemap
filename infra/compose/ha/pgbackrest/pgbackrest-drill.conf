# pgBackRest on the restore-drill host (C-56, C-108): repository 2 ONLY, with a read+list SAS (`rl`) and repository
# 2's cipher pass. It cannot write, delete or even see repository 1. Secrets from the environment:
# PGBACKREST_REPO2_AZURE_KEY (the `rl` SAS token), PGBACKREST_REPO2_CIPHER_PASS.
[global]
repo2-type=azure
repo2-azure-account=scfbackupb
repo2-azure-container=pgbackrest
repo2-azure-key-type=sas
repo2-path=/scf
repo2-cipher-type=aes-256-cbc
repo2-storage-host=azurite-b
repo2-storage-port=10000
repo2-azure-uri-style=path
repo2-storage-ca-file=/run/secrets/azurite_ca
process-max=4
log-level-console=warn
log-level-file=off

[scf]
pg1-path=/var/lib/postgresql/18/main
pg1-socket-path=/var/run/postgresql
