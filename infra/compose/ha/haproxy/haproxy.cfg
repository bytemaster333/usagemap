# SPDX-License-Identifier: Apache-2.0
# Primary-following TCP proxy of the HA profile (ADR-0020: "a local proxy that follows Patroni's /primary endpoint",
# C-07). HAProxy 3.2 LTS (GPL-2.0-or-later, a separately run unmodified tool — supply-chain.md §5.1).
# In compose.ha.yaml it takes over the service name `postgres`, so everything that used `postgres:5432` (PgBouncer,
# the migrators, Umami) now reaches whichever node Patroni reports as primary. Only one node answers 200 on /primary;
# on failover the old server is marked down and its sessions are cut (`on-marked-down shutdown-sessions`), so
# PgBouncer's server connections are re-opened against the new primary — this is the PgBouncer re-pointing.
global
  maxconn 1000
  log stdout format raw local0 notice

defaults
  mode tcp
  log global
  option dontlognull
  timeout connect 3s
  timeout client 30m
  timeout server 30m
  timeout check 2s

# Container health: 200 only while a primary is up (Compose healthcheck: wget …/health).
frontend health
  mode http
  bind :8404
  monitor-uri /health
  monitor fail if { nbsrv(pg_primary) lt 1 }

frontend pg
  bind :5432
  default_backend pg_primary

backend pg_primary
  option httpchk GET /primary
  http-check expect status 200
  # inter 2s, fall 2, rise 2: a demoted or dead node is out within ≈ 4 s; the promoted one in within ≈ 4 s.
  default-server inter 2s fastinter 1s downinter 2s fall 2 rise 2 on-marked-down shutdown-sessions init-addr last,libc,none resolvers docker
  # Patroni's REST API over TLS (F15), verified against the DCS CA and the node name.
  server pg-a pg-a:5432 check port 8008 check-ssl verify required ca-file /usr/local/etc/haproxy/dcs-ca.pem check-sni pg-a verifyhost pg-a
  server pg-b pg-b:5432 check port 8008 check-ssl verify required ca-file /usr/local/etc/haproxy/dcs-ca.pem check-sni pg-b verifyhost pg-b

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s
