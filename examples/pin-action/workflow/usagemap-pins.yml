# SPDX-License-Identifier: Apache-2.0
# Copy to .github/workflows/usagemap-pins.yml. Checks every UsageMap <script> tag (exact version + SRI hash +
# crossorigin) and uploads a patch with the proposed pins. No token, no push, no pull request.
name: UsageMap tracker pins
on: [pull_request, workflow_dispatch]
permissions: { contents: read }
jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<pinned sha>
      - id: pins
        uses: <owner>/<repo>/tools/pin-action@<pinned sha>
        with:
          path: site
          hosts: e1.usagemap.dev,e2.usagemap.dev
      - if: always() && steps.pins.outputs.patch-file != ''
        uses: actions/upload-artifact@<pinned sha>
        with: { name: usagemap-tracker-pins, path: "${{ steps.pins.outputs.patch-file }}" }
